<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

   <title>Edit Car</title>
</head>

<body>
   <div class="container">
      <h1>Edit Car</h1>

      <form th:action="@{/admin/edit/{id}(id=${id})}" th:object="${carForm}" enctype="multipart/form-data"  method="post">
         <div>
            <label for="" class="form-label mt-4">Marque</label>
            <input type="text" id="marque" th:field="*{marque}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('marque')}" th:errors="*{marque}" class="invalid-feedback">marque Error</span>
         </div>
         <div>
            <label for="" class="form-label mt-4">Model :</label>
            <input type="text" id="model" th:field="*{model}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="invalid-feedback">model Error</span>
         </div>
         <div>
            <label for="" class="form-label mt-4">Annee de Fabrication :</label>
            <input type="date" id="annee_fab" th:field="*{annee_fab}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('annee_fab')}" th:errors="*{annee_fab}" class="invalid-feedback">annee_fab Error</span>
         </div>
         <div>
            <label for="" class="form-label mt-4">Kilometrage</label>
            <input type="number" id="kilometrage" th:field="*{kilometrage}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('kilometrage')}" th:errors="*{kilometrage}" class="invalid-feedback">kilometrage  Error</span>
         </div>
         <div>
            <label for="" class="form-label mt-4">transmission :</label>
            <input type="text" id="transmission" th:field="*{transmission}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('transmission')}" th:errors="*{transmission}" class="invalid-feedback">transmission Error</span>
         </div>
         <div>
            <label for="" class="form-label mt-4">Nombre de portes</label>
            <input type="number" id="nbre_porte" th:field="*{nbre_porte}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('nbre_porte')}" th:errors="*{nbre_porte}" class="invalid-feedback">nbre_porte Error</span>
         </div>
         <div>
            <label for="" class="form-label mt-4">prix_par_jour</label>
            <input type="number" id="prix_par_jour" th:field="*{prix_par_jour}" class="form-control mt-2">
            <span th:if="${#fields.hasErrors('prix_par_jour')}" th:errors="*{prix_par_jour}" class="invalid-feedback">prix_par_jour Error</span>
         </div>
         <div>
            <label for="file" class="form-label mt-4">Photo</label>
            <input type="file" name="file" class="form-control mt-2">
        </div>
         <div>
            <label for="status" class="form-label mt-4">Status</label>
            <input type="text" id="status" th:field="*{etat}" class="form-control mt-2"  th:classappend="${#fields.hasErrors('etat')}?is-invalid">
            <span th:if="${#fields.hasErrors('etat')}" th:errors="*{etat}" class="invalid-feedback">etat Error</span>
         </div>
         <div>
            <input class="btn btn-success" type="submit" value="Edit">
         </div>
      </form>
      <br> <br>
      <div>
         <a th:href="@{/admin}">Back</a>
      </div>
   </div>


   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76A2z02tPqdjfvDkF9bC2E2FwTp6MQ0nT9G8clSLSBz3HgIYXjFZJbF5dx2Lx3k" crossorigin="anonymous"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr" xmlns="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Réservations - Location de Voitures</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #222;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
    }

    select, input, button {
      padding: 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      background-color: #007bff;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .back-btn {
      background-color: #6c757d;
    }

    .back-btn:hover {
      background-color: #5a6268;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #f1f3f5;
      font-weight: 600;
    }

    .status-pending {
      background-color: #ffc107;
      color: #000;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .status-confirmed {
      background-color: #28a745;
      color: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .status-rejected {
      background-color: #dc3545;
      color: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .action-btn {
      padding: 8px 12px;
      font-size: 0.9rem;
      min-width: 100px;
    }

    .confirm-btn {
      background-color: #28a745;
    }

    .confirm-btn:hover {
      background-color: #218838;
    }

    .reject-btn {
      background-color: #dc3545;
    }

    .reject-btn:hover {
      background-color: #c82333;
    }

    @media (max-width: 768px) {
      .filters {
        grid-template-columns: 1fr;
      }
      
      .actions {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestion des Réservations</h1>

    <div class="filters">
      <select id="statusFilter">
        <option value="all">Tous les statuts</option>
        <option value="pending">En attente</option>
        <option value="confirmed">Confirmées</option>
        <option value="rejected">Refusées</option>
      </select>
      
      <input type="date" id="startDate" placeholder="Date de début" />
      
      <input type="date" id="endDate" placeholder="Date de fin" />
      
      <button type="button" >Filtrer</button>
    </div>

    <a th:href="@{/admin}">
      <button class="back-btn">Retour à l'admin</button>
    </a>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Date Début</th>
          <th>Date Fin</th>
          <th>Prix Total</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="reservationList" th:each="reservation: ${reservations}">
        <td th:text="${reservation.id}"></td>
        
        <td th:text="${#temporals.format(reservation.date_deb, 'dd/MM/yyyy')}"></td>
        <td th:text="${#temporals.format(reservation.date_fin, 'dd/MM/yyyy')}"></td>
        <td th:text="${reservation.prixTotale + ' €'}"></td>
        <td>
          <span th:classappend="'status-' + ${reservation.statut}" 
                th:text="${reservation.statut}"></span>
        </td>
        <td class="actions">
          <form th:action="@{|/admin/reservations/${reservation.id}/confirmer|}" method="post">
            <button th:if="${reservation.statut == 'en attente'}" 
                  class="action-btn confirm-btn" 
                  type="submit">
                  confirmer
            </button>
          </form>
          <form th:action="@{|/admin/reservations/${reservation.id}/refuser|}" method="post">
            <button th:if="${reservation.statut == 'en attente'}" 
                  class="action-btn reject-btn" 
                  type="submit">
              refuser
            </button>
          </form>
          <form th:action="@{|/admin/reservations/${reservation.id}|}" method="get">
        <button class="action-btn" type="submit">
            Détails
        </button>
    </form>
        </td>
      </tbody>
    </table>
  </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Add Car</title>
  </head>

  <body>
    <div class="container">
      <h1>Add Car</h1>

      <form
        th:action="@{/admin/create}"
        th:object="${carForm}"
        method="Post"
        enctype="multipart/form-data"
      >
        <div>
          <label for="" class="form-lablel mt-4">Marque</label>
          <input class="form-control mt-2"  type="text" id="marque" th:field="*{marque}" th:classappend="${#fields.hasErrors('marque')}?is-invalid" />
          <span class="invalid-feedback" th:if="${#fields.hasErrors('marque')}" th:errors="*{marque}"
            >marque Error</span
          >
        </div>
        <div>
          <label for="" class="form-lablel mt-4">Model</label>
          <input class="form-control mt-2"  type="text" id="model" th:field="*{model}" th:classappend="${#fields.hasErrors('model')}?is-invalid" />
          <span class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"
            >model Error</span
          >
        </div>
        <div>
          <label for="" class="form-lablel mt-4">Annee de fabriquation :</label>
          <input class="form-control mt-2"  type="date" id="annee_fab" th:field="*{annee_fab}" th:classappend="${#fields.hasErrors('annee_fab')}?is-invalid" />
          <span class="invalid-feedback"
            th:if="${#fields.hasErrors('annee_fab')}"
            th:errors="*{annee_fab}"
            >annee_fab Error</span
          >
        </div>
        <div>
          <label for="" class="form-lablel mt-4">Kilometrage :</label>
          <input class="form-control mt-2"  type="number" id="kilometrage" th:field="*{kilometrage}" th:classappend="${#fields.hasErrors('kilometrage')}?is-invalid" />
          <span class="invalid-feedback"
            th:if="${#fields.hasErrors('kilometrage')}"
            th:errors="*{kilometrage}"
            >Kilometrage Error</span
          >
        </div>

        <div>
          <label for="" class="form-lablel mt-4">transmission:</label>
          <input class="form-control mt-2" 
            type="text"
            id="transmission"
            th:field="*{transmission}"
            placeholder="Manuelle or Automatique"
            th:classappend="${#fields.hasErrors('transmission')}?is-invalid"
          />
          <span class="invalid-feedback"
            th:if="${#fields.hasErrors('transmission')}"
            th:errors="*{transmission}"
            >price Error</span
          >
        </div>
        <div>
          <label for="" class="form-lablel mt-4">Nombre des portes:</label>
          <input class="form-control mt-2"  type="number" id="nbre_porte" th:field="*{nbre_porte}" th:classappend="${#fields.hasErrors('nbre_porte')}?is-invalid" />
          <span class="invalid-feedback"
            th:if="${#fields.hasErrors('nbre_porte')}"
            th:errors="*{nbre_porte}"
            >nbre_porte Error</span
          >
        </div>
        <div>
          <label for="" class="form-lablel mt-4">Prix par jour :</label>
          <input class="form-control mt-2"  type="number" id="prix_par_jour" th:field="*{prix_par_jour}" th:classappend="${#fields.hasErrors('prix_par_jour')}?is-invalid" />
          <span class="invalid-feedback"
            th:if="${#fields.hasErrors('prix_par_jour')}"
            th:errors="*{prix_par_jour}"
            >price Error</span
          >
        </div>
        <div>
          <label for="file" class="form-lablel mt-4">Photo</label>
          <input class="form-control mt-2"  type="file" name="file" />
        </div>
        <div>
          <button type="submit" class="btn btn-success" >Ajouter</button>
        </div>
      </form>
      <br />
      <br />
      <div>
        <a th:href="@{/admin}">Back</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76A2z02tPqdjfvDkF9bC2E2FwTp6MQ0nT9G8clSLSBz3HgIYXjFZJbF5dx2Lx3k" crossorigin="anonymous"></script>
  </body>
</html>

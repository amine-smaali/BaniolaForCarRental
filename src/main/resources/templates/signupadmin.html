<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Inscription</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #e9ecef;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .form-container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 400px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
      }

      label {
        display: block;
        margin-top: 15px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background-color: #198754;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
      }

      .success {
        color: green;
        text-align: center;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Inscription Admin</h2>
      <form id="signupForm" th:object="${adminform}" method="post">
        <label for="nom">Nom: </label>
        <input th:field="*{nom}" type="text" id="nom" name="nom" />
        <div th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}">
          code error
        </div>
        <label for="prenom">Prenom: </label>
        <input th:field="*{prenom}" type="text" />
        <div th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}">
          code error
        </div>
        <label for="nom">Telephone : </label>
        <input
          th:field="*{tel}"
          type="text"
          pattern="^(2|3|4|5|7|9)[0-9]{7}$"
        />
        <div th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}">
          code error
        </div>
        <label for="email">Email</label>
        <input type="email" th:field="*{email}" id="email" name="email" />
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
          code error
        </div>
        <label for="password">Mot de passe</label>
        <input
          type="password"
          th:field="*{password}"
          id="password"
          name="password"
        />
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
          code error
        </div>
        <label for="codeAgence">Code Agence:</label>
        <input type="text" th:field="*{codeAgence}" pattern="[0-9]{5}" />
        <div
          th:if="${#fields.hasErrors('codeAgence')}"
          th:errors="*{codeAgence}"
        >
          code error
        </div>

        <button type="submit">S'inscrire</button>
      </form>
      <div class="success" id="successMsg">Inscription réussie !</div>
    </div>
  </body>
</html>

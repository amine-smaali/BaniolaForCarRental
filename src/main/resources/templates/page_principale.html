<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VelociDrive - Location de Voitures de Luxe</title>
    <style>
      /* Styles généraux */
      body {
        font-family: "Montserrat", sans-serif;
        background-color: #0a0a0a;
        color: #fff;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }

      /* Animations globales */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeScale {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes glow {
        0% {
          box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
        }
        100% {
          box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 50px;
        background: rgba(0, 0, 0, 0.6);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        animation: fadeIn 1s ease-in-out;
      }

      .logo {
        font-size: 2em;
        font-weight: bold;
        color: #d4af37;
        text-decoration: none;
        letter-spacing: 1.5px;
        transition: transform 0.3s ease-in-out;
      }

      .logo:hover {
        transform: scale(1.1);
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        margin: 0 20px;
        font-weight: 500;
        transition: color 0.3s, transform 0.3s;
        font-size: 1.1em;
      }

      .nav-links a:hover {
        color: #d4af37;
        transform: scale(1.1);
      }

      /* Hero Section */
      .hero {
        height: 100vh;
        background: url("https://images.unsplash.com/photo-1555215695-3004980ad54e")
          center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        animation: fadeScale 1.5s ease-in-out;
      }

      .hero-content h1 {
        font-size: 4em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.7);
      }

      .cta-button {
        background: linear-gradient(90deg, #d4af37, #ffdf00);
        color: #000;
        padding: 15px 40px;
        font-size: 1.3em;
        border: none;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 50px;
        font-weight: bold;
        animation: glow 1.5s infinite alternate;
      }

      .cta-button:hover {
        background: white;
        color: black;
        transform: scale(1.1);
      }

      /* Collection Section */
      .collection-section {
        padding: 100px 50px;
        text-align: center;
      }

      .car-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 30px;
        padding-top: 30px;
      }

      .car-card {
        background: #111;
        border-radius: 15px;
        overflow: hidden;
        transition: transform 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
        box-shadow: 0 5px 15px rgba(255, 215, 0, 0.1);
        animation: fadeIn 1.5s ease-in-out;
      }

      .car-card:hover {
        transform: scale(1.1);
        box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
      }

      .car-image {
        height: 250px;
        background-size: cover;
        position: relative;
        border-bottom: 2px solid rgba(255, 215, 0, 0.3);
      }

      .car-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .car-card:hover .car-overlay {
        opacity: 1;
      }

      .view-details {
        background: linear-gradient(90deg, #d4af37, #ffdf00);
        padding: 10px 20px;
        text-decoration: none;
        color: black;
        font-weight: bold;
        border-radius: 25px;
        transition: 0.3s;
      }

      .view-details:hover {
        background: white;
        color: black;
        transform: scale(1.1);
      }

      /* Footer */
      .footer {
        text-align: center;
        padding: 30px;
        background: #111;
        font-size: 1.1em;
        border-top: 1px solid rgba(255, 215, 0, 0.3);
        animation: fadeIn 2s ease-in-out;
      }
      .navbar {
  display: flex;
  list-style: none;
  gap: 20px;
}

.dropdown {
  position: relative;
}

.dropbtn {
  background-color: #4CAF50;
  color: white;
  border-radius: 10px ;
  padding: 10px;
  cursor: pointer;
  font-size: 16px;
}

.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background-color: #333;
  min-width: 120px;
  z-index: 1;
  padding: 0;
  border-radius:10px ;
}

.dropdown-content li {
  list-style: none;
}

.dropdown-content a {
  color: white;
  padding: 10px;
  display: block;
  text-decoration: none;
}

.dropdown:hover .dropdown-content {
  display: block;
}
    </style>
  </head>
  <body>
    <header class="header">
      <a th:href="@{/}" class="logo">Baniola</a>
      <nav class="nav-links">
        <ul class="navbar">
            <li><a href="#">Collection</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            
        <li class="dropdown">
            <button class="dropbtn">Connecter</button>
            <ul class="dropdown-content">
            <li><a th:href="@{/login/admin}">Admin</a></li>
            <li><a th:href="@{/login/client}">Client</a></li>
            </ul>
        </li>

        <li class="dropdown">
            <button class="dropbtn">Inscrire</button>
            <ul class="dropdown-content">
            <li><a th:href="@{/signup/admin}">Admin</a></li>
            <li><a th:href="@{/signup/client}">Client</a></li>
            </ul>
        </li>
      </nav>
      <button class="mobile-menu-button">☰</button>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1>L'Excellence Automobile</h1>
        <p>Découvrez notre sélection exclusive de véhicules de prestige</p>
        <a th:href="@{#collection}" class="cta-button"
          >Explorer la collection</a
        >
      </div>
    </section>

    <section th:class="collection-section" id="collection">
      <h2 th:class="section-title">Notre Sélection</h2>
      <div th:class="car-grid">
        <article th:class="car-card" th:each="voiture : ${cars}">
          <a th:href="@{/car-details/{id}(id=${voiture.id})}">
          <img
            th:src="(${voiture.photo})?@{|/images/${voiture.photo}|}:@{null.jpg}"
            style="max-height: 400px; max-width: 500px"
            loading="lazy"
          />
            </a>
          <div th:class="car-info">
            <h3
              th:class="car-model"
              th:text="${voiture.marque}+' '+${voiture.model}"
            >
              Nom du modèle
            </h3>
            <p
              th:class="car-price"
              th:text="${voiture.prix_par_jour} + ' €/jour'"
            >
              Prix
            </p>
          </div>
        </article>
      </div>
    </section>

    

    <footer th:class="footer">
        <p th:class="text-center">
      &copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Baniola. All rights reserved
    </p>
    </footer>
  </body>
</html>
